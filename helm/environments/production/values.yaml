# environments/production/values.yaml — ReferralMesh production values in the
# chart's environments/ directory. Kennari test fixture, case D: the second
# in-chart environment-file layout, with NO external values overlay bound.
# Connect this branch with environment "production".
#
# Correct resolution: test.testPrecedenceTag = "environments-dir-file" and the
# precedence-probe workload renders with the production values below.
# If the import skips this file, the probe renders with values.yaml's dev
# defaults and the marker reads "chart-default".

probe:
  gcpServiceAccount: referralmesh-referral-api@referralmesh-prod-4471.iam.gserviceaccount.com
  replicas: 3
  automountServiceAccountToken: false
  readOnlyRootFilesystem: true
  image:
    tag: "2026.09.1"

test:
  testPrecedenceTag: "environments-dir-file"
