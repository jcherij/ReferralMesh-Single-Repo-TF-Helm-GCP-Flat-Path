kind: PrometheusRule
metadata:
  name: notification-service-alerts
  namespace: referralmesh
  labels:
    release: prometheus
spec:
  groups:
    - name: notification-service.rules
      rules:
        - alert: notification-servicePodDown
          expr: kube_deployment_status_replicas_available{deployment="notification-service"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "notification-service has zero available replicas"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: notification-service-role
  namespace: referralmesh
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: notification-service-rolebinding
  namespace: referralmesh
subjects:
  - kind: ServiceAccount
    name: notification-service
    namespace: referralmesh
roleRef:
  kind: Role
  name: notification-service-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-egress-dns
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: notification-service-egress-gcp
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: notification-service
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30 # private.googleapis.com restricted VIP
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-exporter
  namespace: referralmesh
  annotations:
    iam.gke.io/gcp-service-account: referralmesh-notification-svc@referralmesh-prod-4471.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-exporter-config
  namespace: referralmesh
data:
  SERVICE_NAME: "audit-exporter"
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: Secret
metadata:
  name: audit-exporter-secret-refs
  namespace: referralmesh
  annotations:
    # populated by an External Secrets sync from Secret Manager; no secret
    # material is ever committed to this chart
    external-secrets.io/backend: gcp-secret-manager
type: Opaque
stringData:
  SECRET_MANAGER_PROJECT: "referralmesh-prod-4471"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-exporter
  namespace: referralmesh
  labels:
    app: audit-exporter
    env: production
    managed-by: helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audit-exporter
  template:
    metadata:
      labels:
        app: audit-exporter
      annotations:
        checksum/config: "placeholder-checksum"
    spec:
      serviceAccountName: audit-exporter
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit-exporter
          image: us-docker.pkg.dev/referralmesh-prod-4471/referralmesh/audit-exporter:2026.09.1
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: referralmesh-shared-config
            - configMapRef:
                name: audit-exporter-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: audit-exporter
  namespace: referralmesh
  labels:
    app: audit-exporter
spec:
  selector:
    app: audit-exporter
  ports:
    - name: http
      port: 9090
      targetPort: 9090
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-exporter-hpa
  namespace: referralmesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-exporter
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: audit-exporter
  namespace: referralmesh
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: audit-exporter
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: audit-exporter-alerts
  namespace: referralmesh
  labels:
    release: prometheus
spec:
  groups:
    - name: audit-exporter.rules
      rules:
        - alert: audit-exporterPodDown
          expr: kube_deployment_status_replicas_available{deployment="audit-exporter"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "audit-exporter has zero available replicas"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-exporter-role
  namespace: referralmesh
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-exporter-rolebinding
  namespace: referralmesh
subjects:
  - kind: ServiceAccount
    name: audit-exporter
    namespace: referralmesh
roleRef:
  kind: Role
  name: audit-exporter-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-exporter-egress-dns
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: audit-exporter
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-exporter-egress-gcp
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: audit-exporter
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30 # private.googleapis.com restricted VIP
      ports:
        - protocol: TCP
          port: 443
