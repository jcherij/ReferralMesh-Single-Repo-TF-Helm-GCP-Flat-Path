apiVersion: v1
kind: ServiceAccount
metadata:
  name: referral-api
  namespace: referralmesh
  annotations:
    iam.gke.io/gcp-service-account: referralmesh-referral-api@referralmesh-prod-4471.iam.gserviceaccount.com
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: referral-api-config
  namespace: referralmesh
data:
  SERVICE_NAME: "referral-api"
  LOG_FORMAT: "json"
---
apiVersion: v1
kind: Secret
metadata:
  name: referral-api-secret-refs
  namespace: referralmesh
  annotations:
    # populated by an External Secrets sync from Secret Manager; no secret
    # material is ever committed to this chart
    external-secrets.io/backend: gcp-secret-manager
type: Opaque
stringData:
  SECRET_MANAGER_PROJECT: "referralmesh-prod-4471"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: referral-api
  namespace: referralmesh
  labels:
    app: referral-api
    env: production
    managed-by: helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: referral-api
  template:
    metadata:
      labels:
        app: referral-api
      annotations:
        checksum/config: "placeholder-checksum"
    spec:
      serviceAccountName: referral-api
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: referral-api
          image: us-docker.pkg.dev/referralmesh-prod-4471/referralmesh/referral-api:2026.09.1
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: referralmesh-shared-config
            - configMapRef:
                name: referral-api-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: referral-api
  namespace: referralmesh
  labels:
    app: referral-api
spec:
  selector:
    app: referral-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: referral-api-pdb
  namespace: referralmesh
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: referral-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: referral-api-hpa
  namespace: referralmesh
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: referral-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: referral-api
  namespace: referralmesh
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: referral-api
  endpoints:
    - port: metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: referral-api-alerts
  namespace: referralmesh
  labels:
    release: prometheus
spec:
  groups:
    - name: referral-api.rules
      rules:
        - alert: referral-apiPodDown
          expr: kube_deployment_status_replicas_available{deployment="referral-api"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "referral-api has zero available replicas"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: referral-api-role
  namespace: referralmesh
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: referral-api-rolebinding
  namespace: referralmesh
subjects:
  - kind: ServiceAccount
    name: referral-api
    namespace: referralmesh
roleRef:
  kind: Role
  name: referral-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: referral-api-egress-dns
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: referral-api
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: referral-api-egress-gcp
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: referral-api
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 199.36.153.8/30 # private.googleapis.com restricted VIP
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: referral-api-ingress-from-controller
  namespace: referralmesh
spec:
  podSelector:
    matchLabels:
      app: referral-api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
