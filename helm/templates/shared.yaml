apiVersion: v1
kind: Namespace
metadata:
  name: referralmesh
  labels:
    app: referralmesh
    env: production
    managed-by: helm
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: referralmesh
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: v1
kind: LimitRange
metadata:
  name: referralmesh-default-limits
  namespace: referralmesh
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: referralmesh-namespace-quota
  namespace: referralmesh
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "60"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: referralmesh-shared-config
  namespace: referralmesh
data:
  GCP_PROJECT_ID: "referralmesh-prod-4471"
  ENVIRONMENT: "production"
  PUBSUB_TOPIC_REFERRAL_INTAKE: "referral-intake"
  PUBSUB_TOPIC_REFERRAL_MATCHED: "referral-matched"
  PUBSUB_TOPIC_ELIGIBILITY_REQUEST: "eligibility-check-request"
  PUBSUB_TOPIC_ELIGIBILITY_RESULT: "eligibility-check-result"
  PUBSUB_TOPIC_NOTIFICATION_DISPATCH: "notification-dispatch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: referralmesh-prometheus-scrape
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: referralmesh-prometheus-scrape
subjects:
  - kind: ServiceAccount
    name: prometheus-operator
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: referralmesh-prometheus-scrape
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: referralmesh-ingress
  namespace: referralmesh
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - referrals.example.com
      secretName: referralmesh-tls
  rules:
    - host: referrals.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: referral-api
                port:
                  number: 8080
